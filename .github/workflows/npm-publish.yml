name: Stage npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + version) throw new Error("Release tag must match package.json: v" + version);'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and pack package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Stage tarball for manual approval
        # The trusted publisher only needs the npm stage publish permission.
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish "$RUNNER_TEMP/npm-package/"*.tgz --access public --tag "$NPM_DIST_TAG"
